name: Vocab Sync

on:
  push:
    branches:
      - main
    paths:
      - "system/spx-vocab.json"

permissions:
  contents: read

jobs:
  sync:
    name: Fan-out vocab update to implementation repos
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Add new implementation repos here as they are created.
        # Format: "{owner}/{repo}"
        implementation:
          - Starisian-Technologies/sparxstar-ai-manifest-protocol-php

    steps:
      - name: Checkout protocol repo
        uses: actions/checkout@v4

      - name: Verify VOCAB_SYNC_TOKEN is configured
        shell: bash
        env:
          TOKEN_CHECK: ${{ secrets.VOCAB_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN_CHECK" ]; then
            echo "::error::VOCAB_SYNC_TOKEN secret is not set. Add a GitHub PAT with 'repo' scope on the target implementation repositories as a repository secret named VOCAB_SYNC_TOKEN."
            exit 1
          fi

      - name: Extract commit metadata
        id: meta
        run: |
          echo "SHA=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "MESSAGE=$(git log -1 --pretty=format:'%s')" >> "$GITHUB_OUTPUT"

      - name: Open vocab-sync PR in ${{ matrix.implementation }}
        uses: actions/github-script@v7
        env:
          VOCAB_SYNC_TOKEN: ${{ secrets.VOCAB_SYNC_TOKEN }}
        with:
          github-token: ${{ secrets.VOCAB_SYNC_TOKEN }}
          script: |
            const fs = require("fs");

            const [owner, repo] = "${{ matrix.implementation }}".split("/");
            const sourceCommitSha  = "${{ steps.meta.outputs.SHA }}";
            const sourceCommitMsg  = "${{ steps.meta.outputs.MESSAGE }}";
            const vocabContent     = fs.readFileSync("system/spx-vocab.json", "utf8");
            const branchName       = `vocab-sync/protocol-${sourceCommitSha}`;
            const targetFile       = "system/spx-vocab.json";

            // ------------------------------------------------------------------
            // Resolve default branch HEAD
            // ------------------------------------------------------------------
            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoData.default_branch;

            const { data: refData } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`,
            });
            const baseSha = refData.object.sha;

            // ------------------------------------------------------------------
            // Check if the file already has identical content
            // ------------------------------------------------------------------
            let existingContent = null;
            try {
              const { data: existingFile } = await github.rest.repos.getContent({
                owner,
                repo,
                path: targetFile,
                ref: defaultBranch,
              });
              existingContent = Buffer.from(existingFile.content, "base64").toString("utf8");
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            if (existingContent !== null && existingContent.trimEnd() === vocabContent.trimEnd()) {
              console.log(`${owner}/${repo}: spx-vocab.json already up-to-date, skipping.`);
              return;
            }

            // ------------------------------------------------------------------
            // Create sync branch
            // ------------------------------------------------------------------
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: baseSha,
              });
            } catch (err) {
              if (err.status !== 422) throw err;
              // Branch already exists — reset it to the current default-branch HEAD.
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `heads/${branchName}`,
                sha: baseSha,
                force: true,
              });
              console.log(`Branch ${branchName} already exists in ${owner}/${repo}, reset to ${defaultBranch}@${baseSha}.`);
            }

            // ------------------------------------------------------------------
            // Commit updated vocab file
            // ------------------------------------------------------------------
            let fileSha = null;
            try {
              const { data: existing } = await github.rest.repos.getContent({
                owner,
                repo,
                path: targetFile,
                ref: branchName,
              });
              fileSha = existing.sha;
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            const commitParams = {
              owner,
              repo,
              path: targetFile,
              message: `chore(vocab): sync spx-vocab.json from protocol repo (${sourceCommitSha})\n\nSource commit: ${sourceCommitMsg}\nRef: Starisian-Technologies/sparxstar-ai-manifest-protocol@${sourceCommitSha}`,
              content: Buffer.from(vocabContent).toString("base64"),
              branch: branchName,
            };
            if (fileSha) commitParams.sha = fileSha;

            await github.rest.repos.createOrUpdateFileContents(commitParams);

            // ------------------------------------------------------------------
            // Open pull request (skip if one already exists for this branch)
            // ------------------------------------------------------------------
            const { data: openPRs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branchName}`,
            });

            if (openPRs.length > 0) {
              console.log(`PR already open for ${branchName} in ${owner}/${repo}: #${openPRs[0].number}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: `chore(vocab): sync spx-vocab.json from protocol authority (${sourceCommitSha})`,
              body: [
                "## Automated Vocab Sync",
                "",
                "This PR was opened automatically by the `vocab-sync` workflow in",
                "[`Starisian-Technologies/sparxstar-ai-manifest-protocol`](https://github.com/Starisian-Technologies/sparxstar-ai-manifest-protocol).",
                "",
                `**Source commit:** \`${sourceCommitSha}\` — ${sourceCommitMsg}`,
                "",
                "### What changed",
                "",
                "`system/spx-vocab.json` was updated in the protocol authority repository.",
                "This PR syncs that change into this implementation.",
                "",
                "### Review checklist",
                "",
                "- [ ] Diff the vocab changes — confirm no terms were removed that this implementation depends on",
                "- [ ] Run this implementation's test suite",
                "- [ ] Merge when CI passes",
                "",
                "---",
                "_To opt out of automated syncs, remove this repo from the `matrix.implementation` list in_",
                "_[`.github/workflows/vocab-sync.yml`](https://github.com/Starisian-Technologies/sparxstar-ai-manifest-protocol/blob/main/.github/workflows/vocab-sync.yml)._",
              ].join("\n"),
              head: branchName,
              base: defaultBranch,
            });

            console.log(`Opened PR #${pr.number} in ${owner}/${repo}: ${pr.html_url}`);
